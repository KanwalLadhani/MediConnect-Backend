server.port=${PORT:8080}
spring.application.name=mediconnect
spring.config.import=optional:file:./.env[.properties]

# Use an in-memory database for local development. Set SPRING_DATASOURCE_* on Render.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:mediconnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# AI features use the deterministic local fallback when no Gemini key is configured.
mediconnect.ai.gemini-api-key=${GEMINI_API_KEY:}
mediconnect.ai.openai-api-key=${OPENAI_API_KEY:}

logging.level.com.mediconnect=INFO
